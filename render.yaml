services:
  - type: web
    name: vibemusic-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip yt-dlp && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000

